name: Recover stalled Pages deployment
on:
  push:
    paths:
      - '.github/workflows/recover-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  actions: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            try {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {...repo, run_id: 38595813391});
              core.info('Canceled the queued retry.');
            } catch (error) {
              if (![409, 422].includes(error.status)) throw error;
              core.info('Force cancel response: ' + error.status + ' ' + error.message);
            }
            const deploymentId = '3231b818d16681deb67c1490874cedc85d589565';
            const result = await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {...repo, deploymentId});
            core.info('Pages cancellation accepted: ' + result.status);
            for (let attempt = 0; attempt < 12; attempt++) {
              const current = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {...repo, deploymentId});
              core.info('Pages state: ' + current.data.status);
              if (!['deployment_in_progress', 'updating_pages', 'queued', 'syncing_files', 'waiting'].includes(current.data.status)) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
