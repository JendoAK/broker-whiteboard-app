<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Event table planner</title><style>body{margin:0;background:#fffdf8}#show-planner-demo{border:0;border-radius:0}select,input{font-size:16px}</style></head><body>
<div class="viz-dotted-background">
<div id="show-planner-demo" aria-label="Event table planner">
<style>
#show-planner-demo { --paper:light-dark(#fffdf8,#222b29); --ink:light-dark(#263c39,#e4eee9); --line:light-dark(#cdd8ce,#52645a); --soft:light-dark(#edf3ed,#303d36); --teal:light-dark(#246d69,#9ad8ca); --gold:light-dark(#f6d76d,#82641d); --steel:light-dark(#e1e5e3,#53625e); --wood:light-dark(#e7ca93,#75603c); --zone1:light-dark(#e2eee7,#2c493f); --zone2:light-dark(#fbefce,#4e462f); color:var(--ink); background:var(--paper); font:15px/1.4 Arial,sans-serif; padding:18px; border:1px solid var(--line); border-radius:12px; }
#show-planner-demo * { box-sizing:border-box; }
#show-planner-demo [hidden] { display:none !important; }
#show-planner-demo h2 { font-size:23px; margin:0; font-weight:600; }
#show-planner-demo h3 { font-size:16px; margin:0; }
#show-planner-demo .sp-top,#show-planner-demo .sp-row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
#show-planner-demo .sp-sub { font-size:13px; margin-top:3px; }
#show-planner-demo .sp-badge { background:var(--soft); border-radius:14px; padding:4px 10px; font-size:12px; }
#show-planner-demo button { color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
#show-planner-demo button[aria-pressed=true] { border-color:var(--teal); box-shadow:inset 0 -3px var(--teal); background:var(--soft); }
#show-planner-demo .sp-primary { background:var(--gold); color:light-dark(#352d14,#fff3d7); }
#show-planner-demo input,#show-planner-demo select { width:100%; min-width:0; font:inherit; color:var(--ink); background:var(--paper); border:1px solid var(--line); padding:7px; border-radius:5px; }
#show-planner-demo label { display:grid; gap:4px; font-size:13px; min-width:0; }
#show-planner-demo .sp-fields { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:12px; }
#show-planner-demo .sp-navigation { margin:16px 0 4px; justify-content:flex-start; }
#show-planner-demo .sp-vendors { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
#show-planner-demo .sp-palette { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:8px; }
#show-planner-demo .sp-palette button { display:flex; align-items:center; gap:8px; font-size:13px; text-align:left; min-height:48px; }
#show-planner-demo .sp-sample { display:block; width:29px; height:23px; border:2px solid var(--line); border-radius:5px; background:var(--steel); flex-shrink:0; }
#show-planner-demo .sp-sample.round { border-radius:50%; width:25px; height:25px; }
#show-planner-demo .sp-sample.wood { background:var(--wood); }
#show-planner-demo .sp-sample.lamp { background:var(--wood); border-top:5px solid var(--ink); }
#show-planner-demo .sp-sample.split { background:linear-gradient(90deg,var(--steel) 47%,var(--line) 47%,var(--line) 53%,var(--steel) 53%); }
#show-planner-demo .sp-library { margin-top:16px; }
#show-planner-demo .sp-dimension { display:flex; justify-content:space-between; gap:8px; margin:16px 0 6px; font-size:12px; }
#show-planner-demo .sp-table { width:100%; position:relative; border:3px solid var(--line); border-radius:7px; background:var(--paper); touch-action:none; }
#show-planner-demo .sp-zone { position:absolute; top:0; bottom:0; pointer-events:none; opacity:.85; }
#show-planner-demo .sp-zone.first { left:0; background:var(--zone1); }
#show-planner-demo .sp-zone.second { right:0; background:var(--zone2); border-left:1px dashed var(--line); }
#show-planner-demo .sp-grid { position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px); opacity:.32; }
#show-planner-demo .sp-equipment { position:absolute; padding:3px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:2px solid light-dark(#85928a,#a5b7ac); background:var(--steel); border-radius:9px; box-shadow:inset 0 0 0 3px var(--paper); cursor:grab; touch-action:none; overflow-wrap:anywhere; }
#show-planner-demo .sp-equipment.round { border-radius:50%; }
#show-planner-demo .sp-equipment.wood { background:var(--wood); }
#show-planner-demo .sp-equipment.lamp { background:var(--wood); border-top:7px solid var(--ink); }
#show-planner-demo .sp-equipment.split { background:linear-gradient(90deg,var(--steel) 48%,var(--line) 48%,var(--line) 52%,var(--steel) 52%); }
#show-planner-demo .sp-equipment.selected { outline:3px solid var(--teal); outline-offset:2px; }
#show-planner-demo .sp-equipment .sp-name { font-size:12px; line-height:1.15; }
#show-planner-demo .sp-equipment .sp-product { font-size:12px; line-height:1.15; font-weight:600; }
#show-planner-demo .sp-number { display:none; font-size:12px; }
#show-planner-demo .sp-zone-labels { display:flex; text-align:center; font-size:13px; margin-top:7px; }
#show-planner-demo .sp-zone-labels span { overflow-wrap:anywhere; }
#show-planner-demo .sp-inspector { border-top:1px solid var(--line); margin-top:16px; padding-top:12px; }
#show-planner-demo .sp-actions { justify-content:flex-start; margin-top:10px; }
#show-planner-demo .sp-status { font-size:12px; min-height:18px; margin-top:10px; }
#show-planner-demo .sp-item-list { display:none; }
#show-planner-demo details { margin-top:10px; }
#show-planner-demo summary { font-size:13px; }
#show-planner-demo .sp-empty { padding:12px 0; }
@media(max-width:550px) {
 #show-planner-demo { padding:12px; }
 #show-planner-demo .sp-fields { grid-template-columns:repeat(2,minmax(0,1fr)); }
 #show-planner-demo .sp-palette { grid-template-columns:repeat(2,minmax(0,1fr)); }
 #show-planner-demo input,#show-planner-demo select { font-size:16px; }
 #show-planner-demo .sp-equipment .sp-name,#show-planner-demo .sp-equipment .sp-product { display:none; }
 #show-planner-demo .sp-number { display:block; }
 #show-planner-demo .sp-item-list { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
 #show-planner-demo .sp-item-list button { font-size:13px; min-height:44px; }
 #show-planner-demo .sp-vendors { grid-template-columns:1fr; }
}

 background:radial-gradient(ellipse 23% 16% at 50% 31%,var(--lamp-silver) 89%,var(--lamp-rim) 91%,var(--lamp-rim) 98%,transparent 100%),radial-gradient(ellipse 23% 16% at 50% 67%,var(--lamp-silver) 89%,var(--lamp-rim) 91%,var(--lamp-rim) 98%,transparent 100%),linear-gradient(90deg,transparent 47%,var(--lamp-frame) 47%,var(--lamp-frame) 53%,transparent 53%),var(--board-gold);
 border:2px solid light-dark(#e4c96a,#c4a951); border-radius:17%; box-shadow:none;
}

#show-planner-demo .sp-equipment.lampboard .sp-name,#show-planner-demo .sp-equipment.lampboard .sp-product { background:var(--paper); border-radius:3px; padding:1px 3px; max-width:95%; }
#show-planner-demo .sp-equipment.lampboard .sp-product:empty { display:none; }
#show-planner-demo .sp-sample.lampboard { height:32px; width:23px; }
#show-planner-demo .sp-equipment.lampboard.landscape {
 background:radial-gradient(ellipse 16% 23% at 31% 50%,var(--lamp-silver) 89%,var(--lamp-rim) 91%,var(--lamp-rim) 98%,transparent 100%),radial-gradient(ellipse 16% 23% at 67% 50%,var(--lamp-silver) 89%,var(--lamp-rim) 91%,var(--lamp-rim) 98%,transparent 100%),linear-gradient(0deg,transparent 47%,var(--lamp-frame) 47%,var(--lamp-frame) 53%,transparent 53%),var(--board-gold);
}

#show-planner-demo .sp-equipment.goldboard,#show-planner-demo .sp-sample.goldboard { background:light-dark(#ba9200,#9b7913); border:2px solid light-dark(#806900,#d1b750); border-radius:18%; box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 6px light-dark(#d1b029,#7d6619); color:light-dark(#201b08,#fff5ce); }
#show-planner-demo .sp-sample.goldboard { width:23px; height:32px; box-shadow:inset 0 0 0 2px var(--paper); }

#show-planner-demo .sp-equipment.pizzaboard,#show-planner-demo .sp-sample.pizzaboard { --pizza-wood:light-dark(#ae5b23,#ad703e); --pizza-rim:light-dark(#eeac72,#d39b6c); background:transparent; border:0; box-shadow:none; border-radius:0; position:relative; }

 function preparePrint(){
  packingList();
  root.querySelector('.sp-print-pages').innerHTML=state.tables.map(t=>'<section class="sp-print-page"><p>'+esc(context.name)+'</p><h2>'+esc(t.name)+'</h2><div>'+esc(tableVendors(t).filter(Boolean).join(' · '))+' · '+t.w+' × '+t.h+' in</div><div class="sp-direction">Customers</div><div class="sp-table" style="aspect-ratio:'+t.w+'/'+t.h+'">'+tableVendors(t).map((v,n)=>'<div class="sp-zone" style="left:'+n*100/vendorCount(t)+'%;width:'+100/vendorCount(t)+'%;background:var(--zone'+(n%2+1)+')"></div>').join('')+t.items.map((i,n)=>'<div class="sp-equipment '+def(i).shape+'" style="left:'+i.x/t.w*100+'%;top:'+i.y/t.h*100+'%;width:'+i.w/t.w*100+'%;height:'+i.h/t.h*100+'%">'+equipmentArt(i)+'<span class="sp-number">'+(n+1)+'</span></div>').join('')+'</div><div class="sp-zone-labels">'+tableVendors(t).map(v=>'<span style="width:'+100/vendorCount(t)+'%">'+esc(v||'Vendor')+'</span>').join('')+'</div><div class="sp-direction">Sales team</div><ol class="sp-print-key">'+t.items.map(i=>'<li>'+esc(i.label||shortLabel(def(i)))+(i.product?' — '+esc(i.product):'')+' · '+esc(i.owner===4?'Shared supplies':t.vendors[i.owner]||'Vendor')+'</li>').join('')+'</ol></section>').join('')+'<section class="sp-print-page"><p>'+esc(context.name)+'</p><h2>Packing list · all tables</h2><div class="sp-packing"><table><thead><tr><th>Equipment</th><th>Quantity</th></tr></thead><tbody>'+$('sp-packing-rows').innerHTML+'</tbody></table></div></section>';
 }
 $('sp-print').onclick=()=>{preparePrint();window.print();};
 window.addEventListener('beforeprint',preparePrint);
 root.querySelector('h2').textContent=context.name;
 const eventVendors=[...new Set(catalog.map(p=>p.vendor))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
 [1,2,3,4].forEach(n=>{$('sp-vendor'+n).innerHTML='<option value="">'+(eventVendors.length?'Select event vendor':'Add products to the event first')+'</option>'+eventVendors.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');});
 state.tables.forEach(t=>{t.vendors=t.vendors.map(v=>eventVendors.includes(v)?v:'');});
 state.tables.forEach(t=>t.items.forEach(i=>setProducts(i,assignedProducts(i).map(p=>({id:p.id,label:catalog.find(c=>c.id===p.id)?.label||p.label})))));
 render();
})();
</script>
</div>
</div>
